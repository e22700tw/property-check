<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#073b67">
  <!--
    這是「獨立靜態網站」版本，用來部署到 Firebase Hosting／GitHub Pages／Cloudflare Pages 等平台。
    跟原本 Apps Script 內建的 Index.html 差別只有：資料存取改用 fetch() 呼叫 Apps Script 的 JSON API
    （而不是 google.script.run），這樣頁面才不會被 Google 包進沒有 camera 權限的 iframe，
    即時相機掃描（getUserMedia／Html5Qrcode.start）才能正常運作。

    部署步驟：
    1. 在 Apps Script 專案「部署 > 新增部署」，類型選「網頁應用程式」，執行身分「我」，
       「具有應用程式存取權的使用者」選「任何人」，取得 .../exec 網址。
    2. 把下方 API_BASE_URL 換成那個 .../exec 網址。
    3. 把這個資料夾（static-site/index.html）整個部署到 Firebase Hosting／GitHub Pages 等平台，
       用你自己網域的 https 網址開啟（不要嵌在別的網頁 iframe 裡）。
  -->
  <script defer src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'"></script>
  <style>
    :root{--navy:#073b67;--navy2:#0b558a;--teal:#079b98;--teal2:#19b8ae;--ink:#12324f;--muted:#6f8193;--line:#dce6ee;--soft:#f4f8fb;--ok:#07875f;--warn:#d98200;--bad:#c73535;--shadow:0 12px 32px rgba(9,52,86,.12)}

ar-gradient(100deg,var(--bad),#e07a6f)}.primary:disabled{opacity:.55;cursor:wait}.source{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--soft);padding:15px;border-radius:16px;margin-bottom:13px}.metric{text-align:center}.metric strong{display:block;font-size:25px;color:var(--navy)}.metric.checked strong{color:var(--teal)}.metric span{font-size:12px;color:var(--muted)}.progress{height:8px;background:#dce5ec;border-radius:8px;overflow:hidden;margin:-2px 0 16px}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal2));transition:.25s}.session{font-weight:800;margin:0 0 13px}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.chip{border:0;border-radius:99px;background:#edf2f6;color:var(--ink);padding:9px 17px;white-space:nowrap}.chip.active{background:var(--teal);color:#fff}.asset-card{position:relative}.badge{position:absolute;top:16px;right:16px;border-radius:99px;padding:6px 10px;font-size:13px;font-weight:800}.badge.wait{background:#eaf2ff;color:#24649b}.badge.ok{background:#ddf7ed;color:var(--ok)}.badge.bad{background:#fde8e8;color:var(--bad)}.asset-card h3{margin:0 80px 13px 0;font-size:19px}.details{display:grid;grid-template-columns:90px 1fr;gap:8px;font-size:14px}.details dt{color:var(--muted)}.details dd{margin:0;word-break:break-word}.comment{width:100%;min-height:72px;margin-top:13px;border:1px solid #cbd8e2;border-radius:11px;padding:10px;resize:vertical}.copy-btn{border:1px solid #cbd8e2;background:#fff;color:var(--teal);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;margin-left:6px}.card-manual{margin-top:10px}.card-flag{margin-top:8px;min-height:40px;font-size:13px}.empty{text-align:center;color:var(--muted);padding:50px 15px}.fab{position:fixed;right:max(22px,calc((100vw - 680px)/2));bottom:90px;width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(145deg,var(--teal),#067d8f);color:#fff;font-size:26px;box-shadow:0 10px 28px rgba(0,126,140,.35);z-index:18}.bottomnav{position:fixed;z-index:15;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:72px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr}.navbtn{border:0;background:#fff;color:var(--muted);font-weight:700}.navbtn.active{color:var(--teal)}.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,18,30,.72);display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.scanner-shell{width:min(720px,100%);height:100%;background:#081d2b;display:flex;flex-direction:column}.scanner-head{color:#fff;padding:18px;text-align:center;font-size:21px;font-weight:800}.reader-wrap{flex:1;min-height:310px;position:relative;background:#111;display:grid;place-items:center}.reader-wrap:after{content:"";position:absolute;width:70%;aspect-ratio:1;border:3px solid #45e0d0;border-radius:22px;pointer-events:none}.reader{width:100%}.scan-help{position:absolute;bottom:25px;color:#fff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:99px;z-index:3}.scanner-actions{background:#fff;padding:17px 18px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}.camera-status{margin:0 0 10px;padding:9px 11px;border-radius:10px;background:#eef7f7;color:#176c70;font-size:13px;line-height:1.45}.camera-status.error{background:#fff0e1;color:#8a5200}.photo-scan{margin-bottom:10px}.manual{display:flex;gap:8px}.manual .control{flex:1}.manual button{width:94px}.result{display:none}.result.show{display:block}.result h2{margin:0 0 5px;color:var(--ok)}.result.notfound h2{color:var(--bad)}.result-name{font-size:23px;font-weight:850;margin:12px 0}.action-stack{display:grid;gap:10px;margin-top:14px}.dialog-wrap{position:fixed;inset:0;z-index:80;background:rgba(3,20,33,.68);display:none;align-items:center;justify-content:center;padding:24px}.dialog-wrap.open{display:flex}.dialog{width:min(520px,100%);background:#fff;border-radius:22px;padding:25px;text-align:center;box-shadow:var(--shadow)}.dialog-icon{width:70px;height:70px;border:2px solid #f0a126;border-radius:50%;display:grid;place-items:center;margin:auto;color:var(--warn);font-size:32px}.dialog .eyebrow{display:inline-block;margin-top:12px;background:#fff0d8;color:#8f5200;padding:5px 10px;border-radius:9px;font-weight:800}.dialog h2{font-size:26px;margin:13px 0 8px}.dialog p{color:var(--muted);line-height:1.55}.toast{position:fixed;z-index:100;left:50%;bottom:92px;transform:translate(-50%,20px);background:#173b57;color:#fff;padding:11px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;max-width:88%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{position:fixed;inset:0;background:rgba(255,255,255,.82);z-index:110;display:none;place-items:center;color:var(--navy);font-weight:800}.loading.show{display:grid}.spinner{width:34px;height:34px;border:4px solid #d7e4eb;border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 10px}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:680px){.fab{right:calc((100vw - 680px)/2)}}
    .file-label{display:flex;align-items:center;justify-content:center;text-align:center}.camera-input{position:absolute;width:1px;height:1px;opacity:.01;overflow:hidden}.live-scan{margin-bottom:10px}
    .overlay{height:100dvh;align-items:stretch;overflow:hidden}.scanner-shell{height:100dvh;min-height:0}.scanner-head{position:relative;flex:none;min-height:58px;display:flex;align-items:center;justify-content:center}.scanner-back{position:absolute;left:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#fff;padding:10px;font-weight:800;font-size:16px}.reader-wrap{flex:1 1 auto;min-height:210px;max-height:38dvh}.scanner-actions{flex:0 1 auto;max-height:55dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}.reader-placeholder{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;color:#d9e5eb;text-align:center;line-height:1.55}.reader-placeholder strong{font-size:38px}.capture-button{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.capture-button input{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:5;cursor:pointer}.capture-button span{pointer-events:none}
    .batch-toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink);background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:10px}.batch-toggle input{width:18px;height:18px}
    .comment-row{display:flex;gap:8px;align-items:stretch;margin-top:13px}.comment-row .comment{margin-top:0;flex:1}.card-save-comment{width:64px;min-height:72px;font-size:13px;padding:0}
    .card-photo{margin-top:10px}.card-photo-btn{min-height:40px;font-size:13px}.photo-thumb{width:100%;max-height:160px;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}.photo-pending{font-size:12px;color:var(--warn);font-weight:700;margin-bottom:8px}
    .summary-grid{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}.ring-wrap{position:relative;width:100px;height:100px;flex:none}.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring-label strong{font-size:22px;font-weight:800;line-height:1}.ring-label span{font-size:10px;color:var(--muted);margin-top:2px}.stat-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--soft);border-radius:12px;padding:9px 11px}.stat strong{display:block;font-size:19px;font-weight:800}.stat span{font-size:11px;color:var(--muted)}.stat.bad strong{color:var(--bad)}
    .row-list{display:flex;flex-direction:column;gap:13px}.row-item{display:flex;flex-direction:column;gap:6px}.row-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13px}.row-name{font-weight:700}.row-frac{color:var(--muted);white-space:nowrap;font-size:12px}.bar-track{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--teal2))}
    .flag-item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.flag-item:first-child{border-top:0;padding-top:0}.flag-body{flex:1;min-width:0}.flag-name{font-weight:800;font-size:14px;margin:0 0 3px}.flag-meta{font-size:12px;color:var(--muted);line-height:1.6;word-break:break-word}.flag-meta b{color:var(--ink);font-weight:600}.flag-badge{flex:none;font-size:11px;font-weight:800;color:var(--bad);background:#fde8e8;padding:4px 9px;border-radius:99px;align-self:flex-start}.flag-photo-link{color:var(--teal);font-weight:700;font-size:12px}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><h1>財產檢查</h1></header>

  <section id="searchScreen" class="screen active">
    <div class="steps"><i class="step active"></i><i class="step"></i><i class="step"></i></div>
    <div class="intro">請設定查核條件，<br>以查詢相關財產檢查資料。</div>
    <div class="card">
      <div class="card-title">設定查核條件</div>
      <div class="field"><label for="checkDate">查核日期 <span class="required">*</span></label><input id="checkDate" class="control" type="date"></div>
      <div class="field"><label for="inspector">查核人員 <span class="required">*</span></label><select id="inspector" class="control"><option value="">載入中…</option></select></div>
      <div class="field">
        <label>保管單位 <span class="optional">（選填）</span></label>
        <div class="unit-grid" id="unitGrid"></div>
        <div class="hint">選填，最多選擇 4 層；留空時顯示全部財產。選單內容會依「查核日期」與「查核人員」自動更新。</div>
      </div>
      <div class="field"><label for="locationFilter">存置地點 <span class="optional">（選填）</span></label><select id="locationFilter" class="control"><option value="">全部</option></select></div>
    </div>
    <button id="queryButton" class="primary" type="button">查詢檢查資料</button>
    <div class="source">資料來源：Google 試算表</div>
  </section>

  <section id="listScreen" class="screen">
    <div class="session" id="sessionLabel"></div>
    <div class="summary">
      <div class="metric"><strong id="totalCount">0</strong><span>財產檢查數量</span></div>
      <div class="metric checked"><strong id="checkedCount">0</strong><span>已檢查</span></div>
      <div class="metric"><strong id="remainingCount">0</strong><span>剩餘</span></div>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <button class="secondary" type="button" data-scan>▣　掃描 QR Code／條碼</button>
    <div class="filters" id="filters">
      <button class="chip active" data-filter="全部">全部</button><button class="chip" data-filter="待檢查">待檢查</button><button class="chip" data-filter="正常">正常</button><button class="chip" data-filter="異常">異常</button>
    </div>
    <div id="assetList"></div>
  </section>

  <section id="dashboardScreen" class="screen">
    <div class="card">
      <div class="card-title">查核進度儀表板</div>
      <div class="field"><label for="dashDate">查核日期 <span class="required">*</span></label><input id="dashDate" class="control" type="date"></div>
      <button id="dashQueryButton" class="primary" type="button">查詢進度</button>
    </div>
    <div id="dashboardContent"></div>
  </section>

  <button id="scanFab" class="fab" type="button" data-scan hidden aria-label="掃描 QR Code 或條碼">▣</button>
  <nav class="bottomnav">
    <button id="navSearch" class="navbtn active" type="button">⌕<br>查詢</button>
    <button id="navList" class="navbtn" type="button">▤<br>檢查</button>
    <button id="navDashboard" class="navbtn" type="button">📊<br>儀表板</button>
  </nav>
</main>

<div id="scanOverlay" class="overlay" role="dialog" aria-modal="true">
  <div class="scanner-shell">
    <div class="scanner-head"><button id="closeScannerTop" class="scanner-back" type="button">← 返回</button><span id="scannerHeadLabel">掃描財產標籤</span></div>
    <div class="reader-wrap"><div id="reader" class="reader"></div><div id="readerPlaceholder" class="reader-placeholder"><strong>📷</strong><span>點下方按鈕開啟相機<br>拍攝 QR Code／條碼</span></div><div class="scan-help">請將 QR Code 或條碼完整拍入畫面</div></div>
    <div class="scanner-actions">
      <div id="scanStartPanel">
        <label class="batch-toggle"><input type="checkbox" id="batchModeToggle"> 批次掃描模式（掃到就自動存檔並繼續下一筆）</label>
        <div id="cameraStatus" class="camera-status">正在開啟即時相機…</div>
        <button id="liveScan" class="secondary live-scan" type="button" hidden>▣　啟用框內即時掃描</button>
        <div id="photoScan" class="primary photo-scan capture-button"><span>📷　開啟相機拍攝並辨識</span><input id="cameraCapture" type="file" accept="image/*" capture="environment" aria-label="開啟相機拍攝並辨識"></div>
        <div class="manual"><input id="manualAssetNo" class="control" placeholder="亦可手動輸入 AssetNo"><button id="manualCheck" class="secondary" type="button">比對</button></div>
        <div class="action-stack"><button id="closeScanner" class="secondary" type="button">返回檢查清單</button></div>
      </div>
      <div id="scanResult" class="result">
        <h2 id="resultTitle"></h2><div id="resultName" class="result-name"></div><div id="resultAssetNo"></div>
        <textarea id="resultComment" class="comment" maxlength="200" placeholder="輸入意見（選填）"></textarea>
        <div class="action-stack">
          <button id="confirmOk" class="primary" type="button">確認正常</button>
          <button id="confirmAbnormal" class="danger" type="button">標記異常</button>
          <button id="confirmNotfound" class="primary" type="button" hidden>記錄異常並掃描下一筆</button>
          <button id="rescan" class="secondary" type="button">重新掃描</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="instrumentDialog" class="dialog-wrap" role="alertdialog" aria-modal="true">
  <div class="dialog"><div class="dialog-icon">▤</div><div class="eyebrow">儀器類財產</div><h2>需要加驗校正標籤</h2><p>此筆為儀器類財產，請加驗校正標籤。</p><div class="hint">2 秒後自動回到相機繼續掃描</div></div>
</div>
<div id="toast" class="toast"></div>
<div id="loading" class="loading"><div><div class="spinner"></div><div id="loadingText">載入中…</div></div></div>

<script>
  // ★★★ 請把下面換成你 Apps Script「部署 > 網頁應用程式」取得的 .../exec 網址 ★★★
  const API_BASE_URL = 'https://script.google.com/macros/s/AKfycby0M8sM74M40s0W7acIkh6A70_hoA0l0H63ZLI31bydAAnC3CsWmvwG7wJMx-jkvbL2/exec';

  const state={bootstrap:null,session:null,records:[],filter:'全部',scanning:false,current:null,liveCameraUnavailable:false,zxingReader:null,batchMode:false,batchBusy:false,filterOptions:{unitOptions:[[],[],[],[]],unitPaths:[],locationOptions:[]}};
  function zxingHints_(tryHarder){const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);if(tryHarder)hints.set(ZXing.DecodeHintType.TRY_HARDER,true);return hints}
  function looksLikeAssetCode_(text){return /^[0-9][0-9-]{6,}$/.test(String(text||'').trim())}
  const $=id=>document.getElementById(id);
  document.addEventListener('DOMContentLoaded',init);

  function init(){
    if(!API_BASE_URL||API_BASE_URL.indexOf('PUT_YOUR_APPS_SCRIPT_EXEC_URL_HERE')>=0){showFatal(new Error('尚未設定 API_BASE_URL，請在 index.html 內填入 Apps Script 部署網址。'));return}
    bindEvents(); setLoading(true,'正在讀取查核人員與財產資料…');
    apiGet('bootstrap').then(data=>{state.bootstrap=data;$('checkDate').value=data.today;$('dashDate').value=data.today;fillPersonnel(data.personnel);buildUnits(state.filterOptions.unitOptions);fillLocations(state.filterOptions.locationOptions);refreshFilterOptions_();setLoading(false)}).catch(showFatal);
  }
  async function apiGet(action,params){
    const usp=new URLSearchParams(Object.assign({action:action},params||{}));
    const res=await fetch(API_BASE_URL+'?'+usp.toString(),{method:'GET'});
    if(!res.ok)throw new Error('伺服器連線失敗（HTTP '+res.status+'）');
    const data=await res.json();
    if(!data.ok)throw new Error(data.error||'伺服器發生錯誤');
    return data.data;
  }
  async function apiPost(action,payload){
    const res=await fetch(API_BASE_URL+'?action='+encodeURIComponent(action),{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload||{})
    });
    if(!res.ok)throw new Error('伺服器連線失敗（HTTP '+res.status+'）');
    const data=await res.json();
    if(!data.ok)throw new Error(data.error||'伺服器發生錯誤');
    return data.data;
  }
  function bindEvents(){
    $('queryButton').addEventListener('click',queryRecords);
    $('checkDate').addEventListener('change',refreshFilterOptions_);
    $('inspector').addEventListener('change',refreshFilterOptions_);
    $('navSearch').addEventListener('click',()=>showScreen('search'));
    $('navList').addEventListener('click',()=>showScreen('list'));
    $('navDashboard').addEventListener('click',()=>showScreen('dashboard'));
    $('dashQueryButton').addEventListener('click',queryDashboard);
    document.querySelectorAll('[data-scan]').forEach(btn=>btn.addEventListener('click',openScanner));
    $('closeScanner').addEventListener('click',closeScanner);
    $('closeScannerTop').addEventListener('click',closeScanner);
    $('manualCheck').addEventListener('click',()=>handleCode($('manualAssetNo').value));

      </div>
      <div class="card">
        <div class="card-title">異常項目<span class="hint">共 ${(data.abnormalItems||[]).length} 筆</span></div>
        ${abnormalHtml}
      </div>`;
  }
  function setLoading(show,text){$('loadingText').textContent=text||'載入中…';$('loading').classList.toggle('show',show)}
  function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),3200)}
  function showFatal(e){setLoading(false);toast(e.message||'資料載入失敗');$('inspector').innerHTML='<option value="">無法載入查核人員</option>'}
  function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script>
</body>
</html>
