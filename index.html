<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#073b67">
  <!--
    這是「獨立靜態網站」版本，用來部署到 Firebase Hosting／GitHub Pages／Cloudflare Pages 等平台。
    跟原本 Apps Script 內建的 Index.html 差別只有：資料存取改用 fetch() 呼叫 Apps Script 的 JSON API
    （而不是 google.script.run），這樣頁面才不會被 Google 包進沒有 camera 權限的 iframe，
    即時相機掃描（getUserMedia／Html5Qrcode.start）才能正常運作。

    部署步驟：
    1. 在 Apps Script 專案「部署 > 新增部署」，類型選「網頁應用程式」，執行身分「我」，
       「具有應用程式存取權的使用者」選「任何人」，取得 .../exec 網址。
    2. 把下方 API_BASE_URL 換成那個 .../exec 網址。
    3. 把這個資料夾（static-site/index.html）整個部署到 Firebase Hosting／GitHub Pages 等平台，
       用你自己網域的 https 網址開啟（不要嵌在別的網頁 iframe 裡）。
  -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'"></script>
  <style>
    :root{--navy:#073b67;--navy2:#0b558a;--teal:#079b98;--teal2:#19b8ae;--ink:#12324f;--muted:#6f8193;--line:#dce6ee;--soft:#f4f8fb;--ok:#07875f;--warn:#d98200;--bad:#c73535;--shadow:0 12px 32px rgba(9,52,86,.12)}
    *{box-sizing:border-box} body{margin:0;background:#eef4f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}
    button,input,select,textarea{font:inherit}.app{max-width:720px;min-height:100vh;margin:auto;background:#fff;box-shadow:var(--shadow);padding-bottom:86px}.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:18px 20px 16px;text-align:center}.topbar h1{font-size:24px;margin:0}.screen{display:none;padding:22px 18px}.screen.active{display:block}.steps{display:flex;justify-content:center;gap:9px;margin:0 0 22px}.step{width:9px;height:9px;border-radius:50%;background:#d5e0e8}.step.active{width:30px;border-radius:6px;background:var(--teal)}.intro{font-size:20px;font-weight:800;line-height:1.45;margin:4px 4px 20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 7px 22px rgba(13,64,100,.08);margin-bottom:16px}.card-title{font-size:20px;font-weight:800;margin-bottom:16px}.field{margin:0 0 15px}.field label{display:flex;align-items:center;gap:5px;font-weight:750;margin-bottom:8px}.required{color:#d63232}.optional{font-size:13px;color:var(--muted);font-weight:600}.control{width:100%;height:50px;border:1px solid #cbd8e2;border-radius:12px;background:#fff;color:var(--ink);padding:0 13px;outline:none}.control:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(7,155,152,.12)}.unit-grid{display:grid;grid-template-columns:82px 1fr;gap:8px}.unit-label{display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:10px;font-weight:700}.hint{font-size:13px;color:var(--muted);margin-top:8px}.primary,.secondary,.danger{width:100%;min-height:52px;border:0;border-radius:13px;font-weight:800;cursor:pointer}.primary{color:#fff;background:linear-gradient(100deg,var(--navy2),var(--teal))}.secondary{background:#fff;color:var(--teal);border:2px solid var(--teal)}.primary:disabled{opacity:.55;cursor:wait}.source{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--soft);padding:15px;border-radius:16px;margin-bottom:13px}.metric{text-align:center}.metric strong{display:block;font-size:25px;color:var(--navy)}.metric.checked strong{color:var(--teal)}.metric span{font-size:12px;color:var(--muted)}.progress{height:8px;background:#dce5ec;border-radius:8px;overflow:hidden;margin:-2px 0 16px}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal2));transition:.25s}.session{font-weight:800;margin:0 0 13px}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.chip{border:0;border-radius:99px;background:#edf2f6;color:var(--ink);padding:9px 17px;white-space:nowrap}.chip.active{background:var(--teal);color:#fff}.asset-card{position:relative}.badge{position:absolute;top:16px;right:16px;border-radius:99px;padding:6px 10px;font-size:13px;font-weight:800}.badge.wait{background:#eaf2ff;color:#24649b}.badge.ok{background:#ddf7ed;color:var(--ok)}.badge.bad{background:#fde8e8;color:var(--bad)}.asset-card h3{margin:0 80px 13px 0;font-size:19px}.details{display:grid;grid-template-columns:90px 1fr;gap:8px;font-size:14px}.details dt{color:var(--muted)}.details dd{margin:0;word-break:break-word}.comment{width:100%;min-height:72px;margin-top:13px;border:1px solid #cbd8e2;border-radius:11px;padding:10px;resize:vertical}.empty{text-align:center;color:var(--muted);padding:50px 15px}.fab{position:fixed;right:max(22px,calc((100vw - 680px)/2));bottom:90px;width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(145deg,var(--teal),#067d8f);color:#fff;font-size:26px;box-shadow:0 10px 28px rgba(0,126,140,.35);z-index:18}.bottomnav{position:fixed;z-index:15;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:72px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}.navbtn{border:0;background:#fff;color:var(--muted);font-weight:700}.navbtn.active{color:var(--teal)}.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,18,30,.72);display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.scanner-shell{width:min(720px,100%);height:100%;background:#081d2b;display:flex;flex-direction:column}.scanner-head{color:#fff;padding:18px;text-align:center;font-size:21px;font-weight:800}.reader-wrap{flex:1;min-height:310px;position:relative;background:#111;display:grid;place-items:center}.reader-wrap:after{content:"";position:absolute;width:70%;aspect-ratio:1;border:3px solid #45e0d0;border-radius:22px;pointer-events:none}.reader{width:100%}.scan-help{position:absolute;bottom:25px;color:#fff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:99px;z-index:3}.scanner-actions{background:#fff;padding:17px 18px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}.camera-status{margin:0 0 10px;padding:9px 11px;border-radius:10px;background:#eef7f7;color:#176c70;font-size:13px;line-height:1.45}.camera-status.error{background:#fff0e1;color:#8a5200}.photo-scan{margin-bottom:10px}.manual{display:flex;gap:8px}.manual .control{flex:1}.manual button{width:94px}.result{display:none}.result.show{display:block}.result h2{margin:0 0 5px;color:var(--ok)}.result.notfound h2{color:var(--bad)}.result-name{font-size:23px;font-weight:850;margin:12px 0}.action-stack{display:grid;gap:10px;margin-top:14px}.dialog-wrap{position:fixed;inset:0;z-index:80;background:rgba(3,20,33,.68);display:none;align-items:center;justify-content:center;padding:24px}.dialog-wrap.open{display:flex}.dialog{width:min(520px,100%);background:#fff;border-radius:22px;padding:25px;text-align:center;box-shadow:var(--shadow)}.dialog-icon{width:70px;height:70px;border:2px solid #f0a126;border-radius:50%;display:grid;place-items:center;margin:auto;color:var(--warn);font-size:32px}.dialog .eyebrow{display:inline-block;margin-top:12px;background:#fff0d8;color:#8f5200;padding:5px 10px;border-radius:9px;font-weight:800}.dialog h2{font-size:26px;margin:13px 0 8px}.dialog p{color:var(--muted);line-height:1.55}.toast{position:fixed;z-index:100;left:50%;bottom:92px;transform:translate(-50%,20px);background:#173b57;color:#fff;padding:11px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;max-width:88%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{position:fixed;inset:0;background:rgba(255,255,255,.82);z-index:110;display:none;place-items:center;color:var(--navy);font-weight:800}.loading.show{display:grid}.spinner{width:34px;height:34px;border:4px solid #d7e4eb;border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 10px}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:680px){.fab{right:calc((100vw - 680px)/2)}}
    .file-label{display:flex;align-items:center;justify-content:center;text-align:center}.camera-input{position:absolute;width:1px;height:1px;opacity:.01;overflow:hidden}.live-scan{margin-bottom:10px}
    .overlay{height:100dvh;align-items:stretch;overflow:hidden}.scanner-shell{height:100dvh;min-height:0}.scanner-head{position:relative;flex:none;min-height:58px;display:flex;align-items:center;justify-content:center}.scanner-back{position:absolute;left:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#fff;padding:10px;font-weight:800;font-size:16px}.reader-wrap{flex:1 1 auto;min-height:210px;max-height:45dvh}.scanner-actions{flex:0 1 auto;max-height:48dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}.reader-placeholder{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;color:#d9e5eb;text-align:center;line-height:1.55}.reader-placeholder strong{font-size:38px}.capture-button{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.capture-button input{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:5;cursor:pointer}.capture-button span{pointer-events:none}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar"><h1>財產檢查</h1></header>

  <section id="searchScreen" class="screen active">
    <div class="steps"><i class="step active"></i><i class="step"></i><i class="step"></i></div>
    <div class="intro">請設定查核條件，<br>以查詢相關財產檢查資料。</div>
    <div class="card">
      <div class="card-title">設定查核條件</div>
      <div class="field"><label for="checkDate">查核日期 <span class="required">*</span></label><input id="checkDate" class="control" type="date"></div>
      <div class="field"><label for="inspector">查核人員 <span class="required">*</span></label><select id="inspector" class="control"><option value="">載入中…</option></select></div>
      <div class="field">
        <label>保管單位 <span class="optional">（選填）</span></label>
        <div class="unit-grid" id="unitGrid"></div>
        <div class="hint">選填，最多選擇 4 層；留空時顯示全部財產。</div>
      </div>
    </div>
    <button id="queryButton" class="primary" type="button">查詢檢查資料</button>
    <div class="source">資料來源：Google 試算表</div>
  </section>

  <section id="listScreen" class="screen">
    <div class="session" id="sessionLabel"></div>
    <div class="summary">
      <div class="metric"><strong id="totalCount">0</strong><span>財產檢查數量</span></div>
      <div class="metric checked"><strong id="checkedCount">0</strong><span>已檢查</span></div>
      <div class="metric"><strong id="remainingCount">0</strong><span>剩餘</span></div>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <button class="secondary" type="button" data-scan>▣　掃描 QR Code／條碼</button>
    <div class="filters" id="filters">
      <button class="chip active" data-filter="全部">全部</button><button class="chip" data-filter="待檢查">待檢查</button><button class="chip" data-filter="正常">正常</button><button class="chip" data-filter="異常">異常</button>
    </div>
    <div id="assetList"></div>
  </section>

  <button id="scanFab" class="fab" type="button" data-scan hidden aria-label="掃描 QR Code 或條碼">▣</button>
  <nav class="bottomnav">
    <button id="navSearch" class="navbtn active" type="button">⌕<br>查詢</button>
    <button id="navList" class="navbtn" type="button">▤<br>檢查</button>
  </nav>
</main>

<div id="scanOverlay" class="overlay" role="dialog" aria-modal="true">
  <div class="scanner-shell">
    <div class="scanner-head"><button id="closeScannerTop" class="scanner-back" type="button">← 返回</button><span>掃描財產標籤</span></div>
    <div class="reader-wrap"><div id="reader" class="reader"></div><div id="readerPlaceholder" class="reader-placeholder"><strong>📷</strong><span>點下方按鈕開啟相機<br>拍攝 QR Code／條碼</span></div><div class="scan-help">請將 QR Code 或條碼完整拍入畫面</div></div>
    <div class="scanner-actions">
      <div id="scanStartPanel">
        <div id="cameraStatus" class="camera-status">正在開啟即時相機…</div>
        <button id="liveScan" class="secondary live-scan" type="button" hidden>▣　啟用框內即時掃描</button>
        <div id="photoScan" class="primary photo-scan capture-button"><span>📷　開啟相機拍攝並辨識</span><input id="cameraCapture" type="file" accept="image/*" capture="environment" aria-label="開啟相機拍攝並辨識"></div>
        <div class="manual"><input id="manualAssetNo" class="control" placeholder="亦可手動輸入 AssetNo"><button id="manualCheck" class="secondary" type="button">比對</button></div>
        <div class="action-stack"><button id="closeScanner" class="secondary" type="button">返回檢查清單</button></div>
      </div>
      <div id="scanResult" class="result">
        <h2 id="resultTitle"></h2><div id="resultName" class="result-name"></div><div id="resultAssetNo"></div>
        <textarea id="resultComment" class="comment" maxlength="200" placeholder="輸入意見（選填）"></textarea>
        <div class="action-stack"><button id="confirmNext" class="primary" type="button">確認並掃描下一筆</button><button id="rescan" class="secondary" type="button">重新掃描</button></div>
      </div>
    </div>
  </div>
</div>

<div id="instrumentDialog" class="dialog-wrap" role="alertdialog" aria-modal="true">
  <div class="dialog"><div class="dialog-icon">▤</div><div class="eyebrow">儀器類財產</div><h2>需要加驗校正標籤</h2><p>此筆為儀器類財產，請加驗校正標籤。</p><button id="instrumentOk" class="primary" type="button">確定</button><div class="hint">按下確定後，回到相機繼續掃描</div></div>
</div>
<div id="toast" class="toast"></div>
<div id="loading" class="loading"><div><div class="spinner"></div><div id="loadingText">載入中…</div></div></div>

<script>
  // ★★★ 請把下面換成你 Apps Script「部署 > 網頁應用程式」取得的 .../exec 網址 ★★★
  const API_BASE_URL = 'https://script.google.com/macros/s/AKfycby0M8sM74M40s0W7acIkh6A70_hoA0l0H63ZLI31bydAAnC3CsWmvwG7wJMx-jkvbL2/exec';

  const state={bootstrap:null,session:null,records:[],filter:'全部',scanner:null,scanning:false,current:null,liveCameraUnavailable:false};
  const $=id=>document.getElementById(id);
  document.addEventListener('DOMContentLoaded',init);

  function init(){
    if(!API_BASE_URL||API_BASE_URL.indexOf('PUT_YOUR_APPS_SCRIPT_EXEC_URL_HERE')>=0){showFatal(new Error('尚未設定 API_BASE_URL，請在 index.html 內填入 Apps Script 部署網址。'));return}
    bindEvents(); setLoading(true,'正在讀取查核人員與財產資料…');
    apiGet('bootstrap').then(data=>{state.bootstrap=data;$('checkDate').value=data.today;fillPersonnel(data.personnel);buildUnits(data.unitOptions);setLoading(false)}).catch(showFatal);
  }
  async function apiGet(action,params){
    const usp=new URLSearchParams(Object.assign({action:action},params||{}));
    const res=await fetch(API_BASE_URL+'?'+usp.toString(),{method:'GET'});
    if(!res.ok)throw new Error('伺服器連線失敗（HTTP '+res.status+'）');
    const data=await res.json();
    if(!data.ok)throw new Error(data.error||'伺服器發生錯誤');
    return data.data;
  }
  async function apiPost(action,payload){
    const res=await fetch(API_BASE_URL+'?action='+encodeURIComponent(action),{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload||{})
    });
    if(!res.ok)throw new Error('伺服器連線失敗（HTTP '+res.status+'）');
    const data=await res.json();
    if(!data.ok)throw new Error(data.error||'伺服器發生錯誤');
    return data.data;
  }
  function bindEvents(){
    $('queryButton').addEventListener('click',queryRecords);$('navSearch').addEventListener('click',()=>showScreen('search'));$('navList').addEventListener('click',()=>showScreen('list'));
    document.querySelectorAll('[data-scan]').forEach(btn=>btn.addEventListener('click',openScanner));$('closeScanner').addEventListener('click',closeScanner);$('closeScannerTop').addEventListener('click',closeScanner);$('manualCheck').addEventListener('click',()=>handleCode($('manualAssetNo').value));$('liveScan').addEventListener('click',()=>{state.liveCameraUnavailable=false;startScanner()});$('cameraCapture').addEventListener('change',scanCapturedPhoto);$('rescan').addEventListener('click',restartScanner);$('confirmNext').addEventListener('click',confirmAndNext);$('instrumentOk').addEventListener('click',()=>{$('instrumentDialog').classList.remove('open');resetScannerPanels();if(state.liveCameraUnavailable)setCameraStatus('請按「開啟相機拍攝並辨識」繼續掃描。');else startScanner()});
    $('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;state.filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));renderRecords()});
    $('assetList').addEventListener('input',e=>{if(!e.target.matches('[data-comment]'))return;const rec=findRecord(e.target.dataset.comment);if(rec)rec.comment=e.target.value});
  }
  function fillPersonnel(names){$('inspector').innerHTML='<option value="">請選擇查核人員</option>'+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}
  function buildUnits(options){$('unitGrid').innerHTML=[0,1,2,3].map(i=>`<div class="unit-label">第 ${i+1} 層</div><select id="unit${i}" class="control"><option value="">全部</option>${(options[i]||[]).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select>`).join('');for(let i=0;i<4;i++)$('unit'+i).addEventListener('change',()=>cascadeUnits(i))}
  function cascadeUnits(level){if(!state.bootstrap)return;const chosen=[0,1,2,3].map(i=>$('unit'+i).value);for(let next=level+1;next<4;next++){const current=$('unit'+next).value;const candidates=unitCandidates(next,chosen);$('unit'+next).innerHTML='<option value="">全部</option>'+candidates.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');$('unit'+next).value=candidates.includes(current)?current:'';chosen[next]=$('unit'+next).value}}
  function unitCandidates(level,chosen){const raw=state.bootstrap.unitOptions[level]||[];return raw}
  async function queryRecords(){const date=$('checkDate').value,inspector=$('inspector').value,units=[0,1,2,3].map(i=>$('unit'+i).value);if(!date)return toast('請選擇查核日期');if(!inspector)return toast('請選擇查核人員');setLoading(true,'正在查詢財產資料…');try{state.session=await apiGet('query',{date,inspector,units:units.join(',')});state.records=state.session.records||[];state.filter='全部';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.filter==='全部'));showScreen('list');renderAll()}catch(e){toast(e.message)}finally{setLoading(false)}}
  function showScreen(name){const isList=name==='list';$('searchScreen').classList.toggle('active',!isList);$('listScreen').classList.toggle('active',isList);$('navSearch').classList.toggle('active',!isList);$('navList').classList.toggle('active',isList);$('scanFab').hidden=!isList||!state.session}
  function renderAll(){$('sessionLabel').textContent=`${state.session.date}｜${state.session.inspector}`;renderCounts();renderRecords()}
  function renderCounts(){const total=state.records.length,checked=state.records.filter(r=>r.status!=='待檢查').length;$('totalCount').textContent=total;$('checkedCount').textContent=checked;$('remainingCount').textContent=total-checked;$('progressBar').style.width=(total?checked/total*100:0)+'%'}
  function renderRecords(){const records=state.records.filter(r=>state.filter==='全部'||r.status===state.filter);$('assetList').innerHTML=records.length?records.map(assetCard).join(''):'<div class="empty">沒有符合條件的財產資料</div>'}
  function assetCard(r){const cls=r.status==='正常'?'ok':r.status==='異常'?'bad':'wait';return `<article class="card asset-card"><span class="badge ${cls}">${esc(r.status)}</span><h3>${esc(r.assetName)}</h3><dl class="details"><dt>AssetNo</dt><dd>${esc(r.assetNo)}</dd><dt>保管單位</dt><dd>${esc(r.custodyUnit||'—')}</dd><dt>存置地點</dt><dd>${esc(r.location||'—')}</dd><dt>儀器類</dt><dd>${r.instrument?'是':'否'}</dd></dl><textarea class="comment" data-comment="${esc(r.assetNo)}" maxlength="200" placeholder="輸入意見（選填）">${esc(r.comment||'')}</textarea></article>`}
  function openScanner(){if(!state.records.length)return toast('目前沒有可檢查的財產資料');$('scanOverlay').classList.add('open');resetScannerPanels();$('liveScan').hidden=true;$('readerPlaceholder').style.display='flex';state.liveCameraUnavailable=false;setCameraStatus('正在開啟即時相機…');startScanner()}
  async function startScanner(){if(state.scanning)return;if(state.liveCameraUnavailable){setCameraStatus('此瀏覽器無法使用即時相機，請使用「開啟相機拍攝並辨識」。',true);return}try{if(!window.Html5Qrcode)throw new Error('掃描元件載入失敗，請檢查網路後重新整理。');if(!window.isSecureContext)throw new Error('相機只能在 HTTPS 安全網址使用。');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('目前瀏覽器不支援即時相機。');state.scanner=state.scanner||new Html5Qrcode('reader');setCameraStatus('正在要求相機權限…');let scanAttempts=0;await state.scanner.start({facingMode:'environment'},{fps:10},code=>handleCode(code),()=>{scanAttempts++;if(scanAttempts%15===0)setCameraStatus('即時相機已開啟，請將 QR Code／條碼置於框內。（掃描迴圈運作中，已嘗試 '+scanAttempts+' 次）')});state.scanning=true;$('readerPlaceholder').style.display='none';setCameraStatus('即時相機已開啟，請將 QR Code／條碼置於框內。')}catch(e){state.scanning=false;state.liveCameraUnavailable=true;$('readerPlaceholder').style.display='flex';const reason=cameraErrorMessage(e);setCameraStatus(reason+' 請使用「開啟相機拍攝並辨識」。',true);toast(reason)}}
  async function stopScanner(){if(state.scanner&&state.scanning){try{await state.scanner.stop()}catch(e){}state.scanning=false}}
  function loadImageFromFile_(file){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('圖片讀取失敗'))};img.src=url})}
  async function resizeImageFile_(file,maxDim){try{const img=await loadImageFromFile_(file);const longest=Math.max(img.naturalWidth,img.naturalHeight);if(!longest||longest<=maxDim)return null;const scale=maxDim/longest;const canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return await new Promise(resolve=>canvas.toBlob(blob=>resolve(blob?new File([blob],file.name||'scan.jpg',{type:'image/jpeg'}):null),'image/jpeg',0.92))}catch(e){return null}}
  async function scanCapturedPhoto(event){const file=event.target.files&&event.target.files[0];if(!file)return;setCameraStatus('正在辨識照片中的 QR Code／條碼…');$('readerPlaceholder').style.display='none';try{if(!window.Html5Qrcode)throw new Error('掃描元件載入失敗，請檢查網路後重新整理。');await stopScanner();state.scanner=state.scanner||new Html5Qrcode('reader');const resized=await resizeImageFile_(file,1280);const attempts=resized?[resized,file]:[file];let code=null,lastErr=null;for(const attempt of attempts){try{code=await state.scanner.scanFile(attempt,true);break}catch(err){lastErr=err}}if(!code)throw lastErr||new Error('未辨識到標籤');await handleCode(code)}catch(e){$('readerPlaceholder').style.display='flex';setCameraStatus('照片中未辨識到 QR Code／條碼，請對準標籤、光線充足並靠近後重新拍攝。',true);toast('未辨識到標籤，請重新拍攝')}finally{event.target.value=''}}
  function cameraErrorMessage(error){const name=error&&error.name||'',message=error&&error.message||'';if(name==='NotAllowedError'||/permission|denied|not allowed/i.test(message))return '相機權限遭拒。';if(name==='NotFoundError'||/not found|devices/i.test(message))return '找不到可用的相機。';if(name==='NotReadableError'||/could not start|track/i.test(message))return '相機可能正被其他應用程式使用。';return message||'無法開啟即時相機。'}
  function isSafariBrowser(){const ua=navigator.userAgent||'';return /Safari/i.test(ua)&&!/CriOS|FxiOS|EdgiOS|OPiOS|Chrome|Chromium|Android/i.test(ua)}
  function setCameraStatus(message,isError){$('cameraStatus').textContent=message;$('cameraStatus').classList.toggle('error',!!isError)}
  async function closeScanner(){await stopScanner();$('scanOverlay').classList.remove('open');state.current=null}
  async function handleCode(raw){const code=normalizeAssetNo(extractCode(raw));if(!code)return toast('無法辨識標籤內容');const rec=state.records.find(r=>normalizeAssetNo(r.assetNo)===code);await stopScanner();$('scanStartPanel').style.display='none';$('scanResult').classList.add('show');state.current=rec||{assetNo:String(raw||''),assetName:'',status:'異常',instrument:false,comment:''};if(rec){$('scanResult').classList.remove('notfound');$('resultTitle').textContent='比對成功';$('resultName').textContent=rec.assetName;$('resultAssetNo').textContent='AssetNo　'+rec.assetNo;$('resultComment').style.display='block';$('resultComment').value=rec.comment||'';$('confirmNext').textContent='確認並掃描下一筆'}else{$('scanResult').classList.add('notfound');$('resultTitle').textContent='查無資料';$('resultName').textContent='此標籤未對應任何財產';$('resultAssetNo').textContent='掃描內容　'+String(raw||'');$('resultComment').style.display='block';$('resultComment').value='';$('confirmNext').textContent='記錄異常並掃描下一筆'}}
  async function confirmAndNext(){if(!state.current)return;const rec=state.current,comment=$('resultComment').value.trim(),payload={date:state.session.date,inspector:state.session.inspector,assetNo:rec.assetNo,assetName:rec.assetName,status:rec.assetName?'正常':'異常',comment,instrument:rec.instrument,custodyUnit:rec.custodyUnit||'',location:rec.location||''};setLoading(true,'正在儲存本筆結果…');try{await apiPost('save',payload);if(rec.assetName){rec.status='正常';rec.comment=comment}else{state.records.push({...rec,status:'異常',comment})}renderAll();state.current=null;if(payload.instrument){$('instrumentDialog').classList.add('open');$('scanResult').classList.remove('show')}else{await restartScanner()}}catch(e){toast(e.message)}finally{setLoading(false)}}
  function resetScannerPanels(){$('scanStartPanel').style.display='block';$('scanResult').classList.remove('show','notfound');$('manualAssetNo').value='';$('readerPlaceholder').style.display='flex';state.current=null}
  async function restartScanner(){resetScannerPanels();await startScanner()}
  function findRecord(assetNo){return state.records.find(r=>r.assetNo===assetNo)}
  function extractCode(raw){const value=String(raw||'').trim();try{const parsed=JSON.parse(value);return parsed.AssetNo||parsed.assetNo||parsed.asset_no||value}catch(e){}const match=value.match(/(?:AssetNo|asset_no)\s*[:=]\s*([^,;\s]+)/i);return match?match[1]:value}
  function normalizeAssetNo(v){return String(v||'').trim().toUpperCase().replace(/[\s\-_.／/]/g,'')}
  function setLoading(show,text){$('loadingText').textContent=text||'載入中…';$('loading').classList.toggle('show',show)}
  function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),3200)}
  function showFatal(e){setLoading(false);toast(e.message||'資料載入失敗');$('inspector').innerHTML='<option value="">無法載入查核人員</option>'}
  function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script>
